name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Get TDLib (built by the tdlib workflow)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=$(sed -n 2p .github/tdlib-commit.txt)
          gh release download "$TAG" -p tdlib-android.zip -R ${{ github.repository }}
          unzip -q tdlib-android.zip -d app && rm tdlib-android.zip
          ls app/tdlib/libs/*
      # version 3 = build 104; then 3.1, 3.2, … (one step per build)
      - name: Version
        run: |
          N=$(( ${{ github.run_number }} - 104 ))
          if [ $N -le 0 ]; then V=3; else V=3.$N; fi
          echo "APP_VERSION=$V" >> $GITHUB_ENV
          echo "Version $V"
      - name: Build
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk FrameGrabber.apk
          cp FrameGrabber.apk FrameGrabber-v${{ env.APP_VERSION }}.apk
      - name: Release notes
        env:
          MSG: ${{ github.event.head_commit.message }}
        run: |
          # the commit message without the attribution lines
          printf '%s\n' "$MSG" | grep -v -e '^Co-Authored-By:' -e '^Claude-Session:' > notes.md
          echo "" >> notes.md
          echo "Коммит: ${{ github.sha }}" >> notes.md
      # every build: its own release v3, v3.1, v3.2… (kept forever, the history of versions)
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: Версия ${{ env.APP_VERSION }}
          body_path: notes.md
          target_commitish: ${{ github.sha }}
          files: FrameGrabber-v${{ env.APP_VERSION }}.apk
      # and the same APK under the old fixed link
      - name: Move "latest" to this build
        run: git push -f origin HEAD:refs/tags/latest
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Последняя сборка (${{ env.APP_VERSION }})
          body_path: notes.md
          prerelease: true
          files: FrameGrabber.apk

  # Real checks on an Android emulator: grabs frames from test clips (H.264, rotated, HEVC, HEVC 10-bit HDR)
  emulator-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Get TDLib (built by the tdlib workflow)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=$(sed -n 2p .github/tdlib-commit.txt)
          gh release download "$TAG" -p tdlib-android.zip -R ${{ github.repository }}
          unzip -q tdlib-android.zip -d app && rm tdlib-android.zip
          ls app/tdlib/libs/*
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          ram-size: 4096M
          heap-size: 576M
          disk-size: 6000M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: chmod +x gradlew && sh -c './gradlew connectedDebugAndroidTest --stacktrace; r=$?; adb pull /sdcard/Download/FrameGrabberShots shots; adb logcat -d -v brief AndroidRuntime:E System.err:W FrameGrabber:V OpenGLRenderer:W HWUI:W *:S > shots/logcat.txt; exit $r'
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-test-report
          path: app/build/reports/androidTests/
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: shots/
      - name: Publish screenshots to a branch (for review)
        if: always()
        run: |
          [ -d shots ] || exit 0
          cd shots
          git init -q
          git checkout -q -b ci-screenshots
          git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "screenshots ${GITHUB_SHA}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-screenshots
