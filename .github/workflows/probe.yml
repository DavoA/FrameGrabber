name: Probe site pages (for the «Сайт» screens)
on:
  workflow_dispatch:
  push:
    paths: [ '.github/probe-urls.txt' ]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pages
        run: |
          mkdir out; i=0
          UA="Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Mobile Safari/537.36"
          while read -r url; do
            [ -z "$url" ] && continue; i=$((i+1))
            curl -sSL -A "$UA" -c cj.txt -b cj.txt -D "out/$i.headers" -o "out/$i.html" "$url" || true
            echo "$i $url" >> out/index.txt
          done < .github/probe-urls.txt
          # fastpic: follow the «Перейти к изображению» link with the same cookies — v4 and v6
          for ipv in 4 6 any; do
            o=""; [ "$ipv" != any ] && o="-$ipv"
            rm -f cj2.txt
            curl $o -sSL -A "$UA" -c cj2.txt -b cj2.txt -o p1.html "$(sed -n 1p .github/probe-urls.txt)" || true
            link=$(grep -o 'href="https://fastpic.org/view/[^"]*\.html?[^"]*"' p1.html | head -1 | sed 's/href="//; s/"$//')
            curl $o -sSL -A "$UA" -c cj2.txt -b cj2.txt -e "$(sed -n 1p .github/probe-urls.txt)" -o p2.html "$link" || true
            big=$(grep -o 'https://i[0-9]*\.fastpic\.org/big/[^"'"'"' <>]*' p2.html | head -1 | sed 's/&amp;/\&/g')
            code1=$(curl $o -s -A "$UA" -e "$link" -o img.bin -w '%{http_code} %{content_type} %{size_download}' "$big")
            code2=$(curl $o -s -A "$UA" -b cj2.txt -e "$link" -o img.bin -w '%{http_code} %{content_type} %{size_download}' "$big")
            code3=$(curl $o -s -A "$UA" -o img.bin -w '%{http_code} %{content_type} %{size_download}' "$big")
            echo "ip=$ipv link=$link big=$big | ref: $code1 | ref+cookie: $code2 | bare: $code3" >> out/index.txt
          done
          ls -la out
      - name: Save to branch «probe»
        run: |
          cd out
          git init -q -b probe2 && git add -A
          git -c user.name=ci -c user.email=ci@local commit -qm "pages"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" probe2
